name: QA Automation Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression
          - ui
          - api
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  BASE_UI_URL: ${{ vars.BASE_UI_URL }}
  BASE_API_URL: ${{ vars.BASE_API_URL }}
  USERNAME: ${{ vars.USERNAME }}
  PASSWORD: ${{ secrets.PASSWORD }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  qa-tests:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Allure
        run: |
          sudo npm install -g allure-commandline --save-dev

      - name: Make test runner executable
        run: chmod +x run_tests.sh

      - name: Run Test Suite
        run: |
          if [ "${{ github.event.inputs.suite }}" = "all" ] || [ -z "${{ github.event.inputs.suite }}" ]; then
            ./run_tests.sh
          else
            ./run_tests.sh "${{ github.event.inputs.suite }}"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: test-reports/allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4